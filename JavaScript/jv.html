<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
</head>

<body>
    <h2>Registration Form</h2>
    <form id="myForm">
        <p>
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required placeholder="Enter your Name">
            <span id="name-error"></span>
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email">
            <span id="email-error"></span>
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required placeholder="Enter your password">
            <span id="password-error"></span>
        </p>
        <p>
            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required
                placeholder="Confirm your password">
            <span id="confirm-password-error"></span>
        </p>
        <p>
            <label for="phone">Phone Number:</label>
            <input type="number" id="phone" name="phone" required placeholder="Enter your phone number">
            <span id="phone-error"></span>
        </p>
        <p>
            <label for="subject">Select Your Course:</label>
            <select id="subject" name="Subject">
                <option value="">
                    Select Course
                </option>
                <option value="BTECH">
                    BTECH
                </option>
                <option value="BBA">
                    BBA
                </option>
                <option value="BCA">
                    BCA
                </option>
                <option value="B.COM">
                    B.COM
                </option>
            </select>
            <span id="subject-error" class="error-message"></span>
        </p>
        <p>
            <label for="comment">College Name:</label>
            <textarea id="comment" name="Comment"></textarea>
        </p>
        <p>
            <input type="checkbox" id="agree" name="Agree" />
            <label for="agree">I agree to the above
                information</label>
            <span id="agree-error" class="error-message"></span>
        </p>
        <p>
            <input type="submit" value="Send" name="Submit" onclick="return formValidation();">
            <input type="reset" value="Reset" name="Reset" />
        </p>
    </form>
    <script src="jv.js"></script>
</body>

</html>
